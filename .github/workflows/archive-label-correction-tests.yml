name: ODIN Offline Label Correction

on:
  push:
    branches:
      - central
    paths:
      - "src/services/archive_label_correction.py"
      - "src/ui/archive_label_correction_ui.py"
      - "src/services/faltando_cnn_regression_triage.py"
      - "src/core/archive_persistent_memory.py"
      - "src/ui/training_validation_panel.py"
      - "main.py"
      - "tests/test_archive_label_correction.py"
      - "tests/test_archive_label_correction_ui_encoding.py"
      - "tests/test_faltando_cnn_regression_triage.py"
      - "tests/utf8_console_probe.py"
      - "tests/test_archive_persistent_knn.py"
      - ".github/workflows/archive-label-correction-tests.yml"
  workflow_dispatch:

jobs:
  label-correction:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless scipy scikit-image PyQt6
      - name: Check syntax
        shell: pwsh
        run: |
          python -m py_compile src/services/archive_label_correction.py src/ui/archive_label_correction_ui.py src/services/faltando_cnn_regression_triage.py src/core/archive_persistent_memory.py src/ui/training_validation_panel.py main.py tests/test_archive_label_correction.py tests/test_archive_label_correction_ui_encoding.py tests/utf8_console_probe.py
      - name: Correction and persistent memory regression
        shell: pwsh
        run: |
          python -m unittest tests.test_archive_label_correction tests.test_archive_persistent_knn tests.test_archive_label_correction_ui_encoding tests.test_faltando_cnn_regression_triage -v
