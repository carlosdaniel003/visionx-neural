name: Memory UI

on:
  push:
    branches:
      - central
    paths:
      - "src/ui/memory_status_model.py"
      - "src/ui/memory_status_ui.py"
      - "src/ui/widgets/knn_spectrum.py"
      - "src/ui/strict_category_memory_ui.py"
      - "main.py"
      - "tests/test_memory_ui.py"
      - "tests/test_memory_hypothesis_contrast.py"
      - "tests/test_prototype_memory.py"
      - "tests/test_dual_scale_memory.py"
      - "tests/test_best_match_memory.py"
      - "tests/test_production_confidence_gate.py"
      - ".github/workflows/memory-ui-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless PyQt6

      - name: Compile UI and memory modules
        run: |
          python -m py_compile `
            src/ui/memory_status_model.py `
            src/ui/memory_status_ui.py `
            src/ui/widgets/knn_spectrum.py `
            src/ui/strict_category_memory_ui.py `
            src/core/memory_hypothesis_contrast.py `
            src/core/prototype_memory.py `
            src/core/dual_scale_memory.py `
            src/core/best_match_memory.py `
            src/ui/production_confidence_gate.py `
            main.py `
            tests/test_memory_ui.py

      - name: Run UI and memory regressions
        run: |
          python -m unittest `
            tests.test_memory_ui `
            tests.test_memory_hypothesis_contrast `
            tests.test_prototype_memory `
            tests.test_dual_scale_memory `
            tests.test_best_match_memory `
            tests.test_production_confidence_gate `
            -v
