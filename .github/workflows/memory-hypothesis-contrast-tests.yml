name: Memory Hypothesis Contrast

on:
  push:
    branches:
      - central
    paths:
      - "src/core/memory_hypothesis_contrast.py"
      - "src/core/prototype_memory.py"
      - "src/core/dual_scale_memory.py"
      - "src/core/anomaly_signature.py"
      - "src/core/best_match_memory.py"
      - "src/core/strict_category_memory.py"
      - "src/core/anomaly_memory_integration.py"
      - "src/core/experts/knn_expert.py"
      - "src/services/dataset_manager.py"
      - "src/services/anomaly_learning.py"
      - "src/ui/production_confidence_gate.py"
      - "main.py"
      - "tests/test_memory_hypothesis_contrast.py"
      - "tests/test_prototype_memory.py"
      - "tests/test_dual_scale_memory.py"
      - "tests/test_best_match_memory.py"
      - "tests/test_production_confidence_gate.py"
      - ".github/workflows/memory-hypothesis-contrast-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless PyQt6

      - name: Compile memory modules
        run: |
          python -m py_compile `
            src/core/memory_hypothesis_contrast.py `
            src/core/prototype_memory.py `
            src/core/dual_scale_memory.py `
            src/core/anomaly_signature.py `
            src/core/best_match_memory.py `
            src/core/strict_category_memory.py `
            src/core/anomaly_memory_integration.py `
            src/ui/production_confidence_gate.py `
            main.py `
            tests/test_memory_hypothesis_contrast.py

      - name: Run memory regression tests
        run: |
          python -m unittest `
            tests.test_memory_hypothesis_contrast `
            tests.test_prototype_memory `
            tests.test_dual_scale_memory `
            tests.test_best_match_memory `
            tests.test_production_confidence_gate `
            -v
