name: ROI Input Contract Tests

on:
  push:
    branches:
      - central
    paths:
      - "src/core/roi_input_contract.py"
      - "src/core/roi_visual_alignment.py"
      - "src/core/experts/ssim_texture_expert.py"
      - "src/core/experts/silk_structural_expert.py"
      - "src/core/experts/missing_component_expert.py"
      - "src/core/experts/roi_patch_expert.py"
      - "src/core/semantic_roi_extension.py"
      - "src/core/anomaly_memory_integration.py"
      - "src/ui/widgets/silk_debugger.py"
      - "src/ui/widgets/missing_debugger.py"
      - "main.py"
      - "tests/test_roi_input_contract.py"
      - "tests/test_roi_visual_alignment.py"
      - "tests/test_debugger_canonical_roi_contract.py"
      - ".github/workflows/roi-input-contract-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless scikit-image scikit-learn

      - name: Compile
        run: |
          python -m py_compile \
            src/core/roi_input_contract.py \
            src/core/roi_visual_alignment.py \
            src/core/experts/ssim_texture_expert.py \
            src/core/experts/silk_structural_expert.py \
            src/core/experts/missing_component_expert.py \
            src/core/experts/roi_patch_expert.py \
            src/core/semantic_roi_extension.py \
            src/core/anomaly_memory_integration.py \
            src/ui/widgets/silk_debugger.py \
            src/ui/widgets/missing_debugger.py \
            tests/test_roi_input_contract.py \
            tests/test_roi_visual_alignment.py \
            tests/test_debugger_canonical_roi_contract.py

      - name: Unit tests
        run: |
          python -m unittest \
            tests.test_roi_input_contract \
            tests.test_roi_visual_alignment \
            tests.test_debugger_canonical_roi_contract \
            -v
