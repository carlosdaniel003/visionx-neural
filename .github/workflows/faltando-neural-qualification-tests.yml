name: FALTANDO Neural Visual Qualification

on:
  push:
    branches: [central]
    paths:
      - "src/services/faltando_neural_qualification.py"
      - "src/ui/faltando_neural_review.py"
      - "tests/test_faltando_neural_qualification.py"
      - ".github/workflows/faltando-neural-qualification-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Minimal dependencies
        run: python -m pip install numpy opencv-python-headless PyQt6
      - name: Compile scripts
        run: python -m py_compile src/services/faltando_neural_qualification.py src/ui/faltando_neural_review.py tests/test_faltando_neural_qualification.py
      - name: Test security and visual qualification
        run: python -m unittest tests.test_faltando_neural_qualification -v
