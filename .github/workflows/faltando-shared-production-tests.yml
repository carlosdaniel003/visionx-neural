name: FALTANDO V2 Shared Routing and Supervised Decisions

on:
  push:
    branches: [central]
    paths:
      - "src/core/neural/faltando_category_scope.py"
      - "src/core/neural/faltando_multilight_consensus.py"
      - "src/core/neural/faltando_live.py"
      - "src/core/multilight_fusion.py"
      - "src/core/physical_missing_veto.py"
      - "src/core/knn_visual_corroboration.py"
      - "src/core/corroborated_ng_verdict.py"
      - "src/services/capture_debug_payload.py"
      - "src/ui/decision_verdict_feedback.py"
      - "src/ui/decision_panel.py"
      - "src/ui/network_xp_debug.py"
      - "tests/test_corroborated_ng_binary_verdict.py"
      - "src/ui/neural_influence_model.py"
      - "src/ui/widgets/decision_influence.py"
      - "tests/test_knn_visual_corroboration.py"
      - "tests/test_knn_visual_memory_feedback.py"
      - "src/ui/inspection_memory_feedback.py"
      - "src/ui/widgets/knn_spectrum.py"
      - "tests/test_faltando_three_light_ng_trend.py"
      - "tests/test_faltando_knn_strong_ng_recall.py"
      - "src/core/corroborated_ng_verdict.py"
      - "src/core/physical_missing_veto.py"
      - "src/ui/neural_telemetry_model.py"
      - "src/services/capture_debug_payload.py"
      - "src/services/startup_regression/faltando_archive_neighbors_audit.py"
      - "tests/test_faltando_archive_neighbors_audit.py"
      - "src/ui/adhesive_multilight_inspection.py"
      - "tests/test_cnn_independent_physical_veto.py"
      - "tests/test_cnn_physical_veto_replay.py"
      - "src/services/startup_regression/cnn_physical_veto_replay.py"
      - "src/core/verified_memory_router.py"
      - "src/ui/production_confidence_gate.py"
      - "src/ui/production_autonomy_controller.py"
      - "src/services/decision_persistence.py"
      - "src/services/anomaly_learning.py"
      - "src/services/ng_image_archive.py"
      - "src/ui/control_panel.py"
      - "tests/test_production_continuous_auto.py"
      - "src/ui/production_session_feedback.py"
      - "tests/test_recurrent_ok_production_presentation.py"
      - "tests/test_faltando_shared_production.py"
      - "tests/test_verified_memory_router.py"
      - "tests/test_faltando_cnn_v2_live.py"
      - ".github/workflows/faltando-shared-production-tests.yml"
  pull_request:
    branches: [central]
  workflow_dispatch:

jobs:
  multi-category-supervised:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: "offscreen"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux Qt runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Install CPU and UI dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "numpy>=1.26,<3" "opencv-python-headless>=4.8,<5" scipy scikit-image scikit-learn mss pytesseract PyQt6
      - name: Syntax verification
        run: |
          python -m py_compile src/core/neural/faltando_category_scope.py src/core/neural/faltando_multilight_consensus.py src/core/neural/faltando_live.py src/core/multilight_fusion.py src/core/physical_missing_veto.py src/core/knn_visual_corroboration.py src/core/corroborated_ng_verdict.py tests/test_faltando_three_light_ng_trend.py tests/test_faltando_knn_strong_ng_recall.py src/services/capture_debug_payload.py src/ui/decision_verdict_feedback.py src/ui/decision_panel.py src/ui/network_xp_debug.py tests/test_corroborated_ng_binary_verdict.py src/ui/neural_influence_model.py src/ui/widgets/decision_influence.py tests/test_knn_visual_corroboration.py src/services/startup_regression/faltando_archive_neighbors_audit.py tests/test_faltando_archive_neighbors_audit.py src/ui/adhesive_multilight_inspection.py tests/test_cnn_independent_physical_veto.py tests/test_cnn_physical_veto_replay.py src/services/startup_regression/cnn_physical_veto_replay.py src/core/verified_memory_router.py src/ui/production_confidence_gate.py src/ui/production_autonomy_controller.py src/services/decision_persistence.py src/services/anomaly_learning.py src/services/ng_image_archive.py src/ui/control_panel.py tests/test_production_continuous_auto.py src/ui/production_session_feedback.py tests/test_recurrent_ok_production_presentation.py tests/test_faltando_shared_production.py main.py
      - name: Routing, memory, supervision, pause and production policies
        run: |
          python -m unittest tests.test_faltando_shared_production tests.test_verified_memory_router tests.test_production_confidence_gate tests.test_production_autonomy_controller tests.test_production_continuous_auto tests.test_recurrent_ok_production_presentation tests.test_faltando_cnn_v2_live tests.test_cnn_independent_physical_veto tests.test_cnn_physical_veto_replay tests.test_faltando_archive_neighbors_audit tests.test_knn_visual_corroboration tests.test_knn_visual_memory_feedback tests.test_faltando_three_light_ng_trend tests.test_faltando_knn_strong_ng_recall tests.test_corroborated_ng_binary_verdict tests.test_physical_absence_guard -v
