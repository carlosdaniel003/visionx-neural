name: Network AOI Intake

on:
  push:
    branches:
      - central
    paths:
      - "src/services/network_receiver.py"
      - "src/services/image_cycle_gate.py"
      - "src/ui/network_aoi_intake_filter.py"
      - "src/ui/network_image_cycle_gate.py"
      - "src/core/inspection.py"
      - "src/core/epicenter_extractor.py"
      - "main.py"
      - "tests/test_network_aoi_intake_filter.py"
      - "tests/test_image_cycle_gate.py"
      - "tests/test_qt_button_signal_adapter.py"
      - ".github/workflows/network-aoi-intake-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless scikit-image PyQt6

      - name: Compile intake modules
        run: |
          python -m py_compile `
            src/services/network_receiver.py `
            src/ui/network_aoi_intake_filter.py `
            src/ui/network_image_cycle_gate.py `
            main.py `
            tests/test_network_aoi_intake_filter.py `
            tests/test_image_cycle_gate.py

      - name: Run network and cycle tests
        run: |
          python -m unittest `
            tests.test_network_aoi_intake_filter `
            tests.test_image_cycle_gate `
            tests.test_qt_button_signal_adapter `
            -v
