name: ODIN Neural Evidence Epicenter Panel

on:
  push:
    branches: [central]
    paths:
      - "src/ui/neural_evidence_model.py"
      - "src/ui/widgets/neural_evidence.py"
      - "src/ui/adhesive_multilight_analysis.py"
      - "src/ui/adhesive_multilight_inspection.py"
      - "src/core/neural/faltando_activation_overlay.py"
      - "tests/test_neural_evidence_board.py"
      - ".github/workflows/neural-evidence-board-tests.yml"
  pull_request:
    branches: [central]
  workflow_dispatch:

jobs:
  evidence-ui:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: "offscreen"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native libraries for PyQt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Install Python image and GUI dependencies
        run: |
          python -m pip install "numpy>=1.26,<3" "opencv-python-headless>=4.8,<5" scipy scikit-image PyQt6
      - name: Verify syntax
        run: |
          python -m py_compile src/ui/neural_evidence_model.py src/ui/widgets/neural_evidence.py src/ui/adhesive_multilight_analysis.py src/ui/adhesive_multilight_inspection.py tests/test_neural_evidence_board.py
      - name: Verify two AOI epicenters and responsive neural visual board
        run: |
          python -m unittest tests.test_neural_evidence_board tests.test_adhesive_multilight_inspection tests.test_neural_telemetry_panels tests.test_adhesive_multilight_expert_analysis -v
