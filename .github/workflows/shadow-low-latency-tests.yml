name: ODIN Shadow Low-Latency XP Cycle

on:
  push:
    branches: [central]
    paths:
      - "src/ui/control_panel.py"
      - "src/ui/adhesive_multilight_inspection.py"
      - "src/ui/adhesive_multilight_automation.py"
      - "src/services/screen_monitor.py"
      - "src/services/anomaly_learning.py"
      - "src/services/decision_persistence.py"
      - "tests/test_shadow_fast_capture.py"
      - "tests/test_shadow_partial_persistence.py"
      - ".github/workflows/shadow-low-latency-tests.yml"
  pull_request:
    branches: [central]
  workflow_dispatch:

jobs:
  shadow-fast:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt EGL libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Python dependencies
        run: |
          python -m pip install "numpy>=1.26,<3" "opencv-python-headless>=4.8,<5" scipy scikit-image PyQt6 pytesseract mss
      - name: Syntax check
        run: |
          python -m py_compile src/ui/control_panel.py src/ui/adhesive_multilight_inspection.py src/ui/adhesive_multilight_automation.py src/services/screen_monitor.py src/services/anomaly_learning.py src/services/decision_persistence.py tests/test_shadow_fast_capture.py tests/test_shadow_partial_persistence.py
      - name: Capture, operator labels, 3-lights dataset, XP safety and regressions
        run: |
          python -m unittest tests.test_shadow_fast_capture tests.test_shadow_partial_persistence tests.test_adhesive_multilight_inspection tests.test_adhesive_multilight_automation tests.test_fast_xp_decision_cycle tests.test_multilight_learning tests.test_faltando_shared_production -v
