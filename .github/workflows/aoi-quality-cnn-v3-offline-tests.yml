name: AOI Quality CNN V3 Offline Tests

on:
  push:
    branches: [central]
    paths:
      - "src/core/neural/aoi_quality_cnn_v3.py"
      - "src/scripts/train_aoi_quality_cnn_v3_offline.py"
      - "tests/test_aoi_quality_cnn_v3_offline.py"
      - ".github/workflows/aoi-quality-cnn-v3-offline-tests.yml"
  pull_request:
    branches: [central]
    paths:
      - "src/core/neural/aoi_quality_cnn_v3.py"
      - "src/scripts/train_aoi_quality_cnn_v3_offline.py"
      - "tests/test_aoi_quality_cnn_v3_offline.py"
      - ".github/workflows/aoi-quality-cnn-v3-offline-tests.yml"
  workflow_dispatch:

jobs:
  cnn-v3-paired-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU neural dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy opencv-python-headless
      - name: Check syntax and training isolation
        run: |
          python -m py_compile src/core/neural/aoi_quality_cnn_v3.py src/scripts/train_aoi_quality_cnn_v3_offline.py tests/test_aoi_quality_cnn_v3_offline.py
      - name: Run model, training and safety regressions
        run: |
          python -m unittest tests.test_aoi_quality_cnn_v3_offline -v
