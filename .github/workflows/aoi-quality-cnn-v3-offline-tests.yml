name: AOI Quality CNN V3 Offline Tests

on:
  push:
    branches: [central]
    paths:
      - "src/core/neural/aoi_quality_cnn_v3.py"
      - "src/scripts/train_aoi_quality_cnn_v3_offline.py"
      - "tests/test_aoi_v3_epoch_diagnostics.py"
      - "src/services/aoi_v3_epoch_diagnostics.py"
      - "src/services/odin_operator_validation_labels.py"
      - "src/services/aoi_universal_quality_archive.py"
      - "tests/test_aoi_universal_24_human_repair.py"
      - "tests/test_aoi_quality_cnn_v3_offline.py"
      - "tests/test_aoi_v3_image_only_reviews.py"
      - "src/services/aoi_v3_operator_image_reviews.py"
      - "src/services/aoi_v3_binary_quality_metrics.py"
      - "src/services/aoi_v3_verified_candidate.py"
      - "docs/aoi_v3_operator_image_quality_20261104.json"
      - ".github/workflows/aoi-quality-cnn-v3-offline-tests.yml"
  pull_request:
    branches: [central]
    paths:
      - "src/core/neural/aoi_quality_cnn_v3.py"
      - "src/scripts/train_aoi_quality_cnn_v3_offline.py"
      - "tests/test_aoi_v3_epoch_diagnostics.py"
      - "src/services/aoi_v3_epoch_diagnostics.py"
      - "src/services/odin_operator_validation_labels.py"
      - "src/services/aoi_universal_quality_archive.py"
      - "tests/test_aoi_universal_24_human_repair.py"
      - "tests/test_aoi_quality_cnn_v3_offline.py"
      - "tests/test_aoi_v3_image_only_reviews.py"
      - "src/services/aoi_v3_operator_image_reviews.py"
      - "src/services/aoi_v3_binary_quality_metrics.py"
      - "src/services/aoi_v3_verified_candidate.py"
      - "docs/aoi_v3_operator_image_quality_20261104.json"
      - ".github/workflows/aoi-quality-cnn-v3-offline-tests.yml"
  workflow_dispatch:

jobs:
  cnn-v3-paired-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU neural dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy opencv-python-headless
      - name: Check syntax and training isolation
        run: |
          python -m py_compile src/core/neural/aoi_quality_cnn_v3.py src/scripts/train_aoi_quality_cnn_v3_offline.py src/services/aoi_v3_operator_image_reviews.py src/services/aoi_v3_binary_quality_metrics.py src/services/aoi_v3_verified_candidate.py src/services/aoi_v3_epoch_diagnostics.py src/services/odin_operator_validation_labels.py src/services/aoi_universal_quality_archive.py tests/test_aoi_quality_cnn_v3_offline.py tests/test_aoi_v3_epoch_diagnostics.py tests/test_aoi_universal_24_human_repair.py
      - name: Run model, training and safety regressions
        run: |
          python -m unittest tests.test_aoi_v3_epoch_diagnostics tests.test_aoi_v3_image_only_reviews tests.test_aoi_quality_cnn_v3_offline tests.test_aoi_universal_24_human_repair tests.test_aoi_universal_quality_offline -v
