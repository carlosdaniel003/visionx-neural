name: Inverted Witness Tests

on:
  push:
    branches:
      - central
    paths:
      - "src/core/experts/inverted_face_expert.py"
      - "src/core/experts/inverted_witness_expert.py"
      - "src/core/inverted_face_integration.py"
      - "src/services/dataset_manager.py"
      - "src/ui/inverted_face_panel.py"
      - "src/ui/widgets/inverted_face_debugger.py"
      - "src/ui/decision_model.py"
      - "main.py"
      - "tests/test_inverted_face_*.py"
      - ".github/workflows/inverted-face-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless

      - name: Compile
        run: |
          python -m py_compile \
            src/core/experts/inverted_face_expert.py \
            src/core/experts/inverted_witness_expert.py \
            src/core/inverted_face_integration.py \
            src/services/dataset_manager.py \
            src/ui/inverted_face_panel.py \
            src/ui/widgets/inverted_face_debugger.py

      - name: Unit tests
        run: |
          python -m unittest \
            tests.test_inverted_face_expert \
            tests.test_inverted_face_integration \
            tests.test_inverted_face_json \
            tests.test_inverted_face_ui_contract \
            -v
