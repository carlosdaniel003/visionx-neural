name: ODIN Supervised SIDE False Failure Release

on:
  pull_request:
    branches: [central]
    paths:
      - "src/core/side_memory_first.py"
      - "src/ui/production_confidence_gate.py"
      - "src/ui/production_autonomy_controller.py"
      - "src/services/decision_persistence.py"
      - "src/ui/decision_verdict_feedback.py"
      - "tests/test_side_memory_first.py"
      - "tests/test_side_supervised_release.py"
      - "tests/test_production_autonomy_controller.py"
      - "tests/test_production_continuous_auto.py"
      - ".github/workflows/side-supervised-release-tests.yml"
  push:
    branches: [central]
    paths:
      - "src/core/side_memory_first.py"
      - "src/ui/production_confidence_gate.py"
      - "src/ui/production_autonomy_controller.py"
      - "src/services/decision_persistence.py"
      - "src/ui/decision_verdict_feedback.py"
      - "tests/test_side_memory_first.py"
      - "tests/test_side_supervised_release.py"
      - ".github/workflows/side-supervised-release-tests.yml"
  workflow_dispatch:

jobs:
  supervised-side-release:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless scipy scikit-image PyQt6 pillow mss pytesseract
      - name: Syntax
        run: |
          python -m py_compile src/core/side_memory_first.py src/ui/production_confidence_gate.py src/ui/production_autonomy_controller.py src/services/decision_persistence.py src/ui/decision_verdict_feedback.py tests/test_side_supervised_release.py
      - name: SIDE visual and supervised XP regressions
        run: |
          python -m unittest tests.test_side_memory_first tests.test_side_supervised_release tests.test_production_autonomy_controller tests.test_production_continuous_auto -v
