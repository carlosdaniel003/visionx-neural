name: ODIN Interactive Training Validation

on:
  push:
    branches: [central]
    paths:
      - "src/services/startup_regression/interactive_training_validation.py"
      - "src/ui/training_validation_panel.py"
      - "main.py"
      - "tests/test_interactive_training_validation.py"
      - "tests/test_training_validation_panel.py"
      - ".github/workflows/interactive-training-validation-tests.yml"
  workflow_dispatch:

jobs:
  archive-validation:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies for offline replay and UI
        run: python -m pip install numpy opencv-python-headless scipy scikit-image PyQt6
      - name: Compile diagnostic runner and UI
        run: python -m py_compile src/services/startup_regression/interactive_training_validation.py src/ui/training_validation_panel.py tests/test_interactive_training_validation.py tests/test_training_validation_panel.py main.py
      - name: Check replay, cancellation, reports, shadow UI and per-model metrics
        run: python -m unittest tests.test_interactive_training_validation tests.test_training_validation_panel -v
