name: ODIN Interactive Training Validation

on:
  push:
    branches: [central]
    paths:
      - "src/services/startup_regression/interactive_training_validation.py"
      - "src/services/archive_aoi_category.py"
      - "tests/test_archive_aoi_category.py"
      - "src/ui/training_validation_panel.py"
      - "src/core/knn_similarity_shadow_candidate.py"
      - "src/services/shadow_knn_similarity_probe.py"
      - "src/ui/adhesive_multilight_inspection.py"
      - "src/services/startup_regression/knn_visual_panel_worker.py"
      - "main.py"
      - "tests/test_interactive_training_validation.py"
      - "src/ui/training_validation_panel.py"
      - "src/core/knn_similarity_shadow_candidate.py"
      - "src/services/shadow_knn_similarity_probe.py"
      - "src/ui/adhesive_multilight_inspection.py"
      - "src/services/startup_regression/knn_visual_panel_worker.py"
      - "tests/test_training_validation_panel.py"
      - "tests/test_training_validation_panel.py"
      - "tests/test_knn_archive_visual_replay.py"
      - ".github/workflows/interactive-training-validation-tests.yml"
  pull_request:
    branches: [central]
    paths:
      - "src/services/archive_aoi_category.py"
      - "src/services/startup_regression/interactive_training_validation.py"
      - "tests/test_archive_aoi_category.py"
      - "tests/test_interactive_training_validation.py"
      - ".github/workflows/interactive-training-validation-tests.yml"
  workflow_dispatch:

jobs:
  archive-validation:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt headless runtime dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon-x11-0
      - name: Dependencies for offline replay and UI
        run: python -m pip install numpy opencv-python-headless scipy scikit-image PyQt6
      - name: Compile diagnostic runner and UI
        run: python -m py_compile src/services/startup_regression/knn_visual_panel_worker.py src/services/archive_aoi_category.py tests/test_archive_aoi_category.py src/services/startup_regression/interactive_training_validation.py src/ui/training_validation_panel.py tests/test_interactive_training_validation.py tests/test_training_validation_panel.py main.py
      - name: Check replay, cancellation, reports, shadow UI and per-model metrics
        run: python -m unittest tests.test_archive_aoi_category tests.test_interactive_training_validation tests.test_training_validation_panel -v
