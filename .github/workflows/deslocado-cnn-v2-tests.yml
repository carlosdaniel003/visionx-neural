name: DESLOCADO CNN V2 Component Proxy Training

on:
  push:
    branches: [central]
    paths:
      - "src/services/deslocado_proxy_v2.py"
      - "src/scripts/train_deslocado_cnn_v2.py"
      - "tests/test_deslocado_cnn_v2.py"
      - ".github/workflows/deslocado-cnn-v2-tests.yml"
  workflow_dispatch:

jobs:
  proxy-v2-test:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU requirements
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy opencv-python-headless
      - name: Verify syntax
        run: python -m py_compile src/services/deslocado_proxy_v2.py src/scripts/train_deslocado_cnn_v2.py tests/test_deslocado_cnn_v2.py
      - name: Test generator and synthetic training
        run: python -m unittest tests.test_deslocado_cnn_v2 -v
      - name: Run previous DESLOCADO regression
        run: python -m unittest tests.test_deslocado_cnn -v
