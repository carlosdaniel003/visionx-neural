name: Archive Persistent KNN Memory

on:
  push:
    branches: [central]
    paths:
      - "src/core/archive_persistent_memory.py"
      - "src/services/retire_archive_source_cli.py"
      - "src/core/verified_memory_router.py"
      - "src/core/experts/knn_expert.py"
      - "src/services/startup_regression/knn_visual_neighbors.py"
      - "tests/test_knn_category_only_legacy.py"
      - "src/services/startup_regression/knn_archive_memory_cli.py"
      - "tests/test_archive_persistent_knn.py"
      - "tests/test_knn_archive_auto_memory.py"
      - "src/services/startup_regression/knn_archive_memory_cli.py"
      - "tests/test_archive_persistent_knn.py"
      - "tests/test_live_session_learning.py"
      - "src/services/knn_archive_auto_memory.py"
      - "src/services/archive_aoi_category.py"
      - "tests/test_archive_aoi_category.py"
      - "src/services/live_session_learning.py"
      - "src/services/anomaly_learning.py"
      - "src/core/neural/faltando_live.py"
      - "src/services/neural_online_learning.py"
      - "src/services/decision_persistence.py"
      - "src/scripts/train_faltando_cnn_v2_online.py"
      - ".github/workflows/archive-persistent-knn-tests.yml"
  pull_request:
    branches: [central]
    paths:
      - "src/core/archive_persistent_memory.py"
      - "src/services/retire_archive_source_cli.py"
      - "tests/test_archive_persistent_knn.py"
      - "src/core/verified_memory_router.py"
      - "src/services/startup_regression/knn_visual_neighbors.py"
      - "tests/test_knn_category_only_legacy.py"
      - "src/services/knn_archive_auto_memory.py"
      - "tests/test_knn_archive_auto_memory.py"
      - ".github/workflows/archive-persistent-knn-tests.yml"
  workflow_dispatch:

jobs:
  persistence:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install numpy opencv-python-headless scipy scikit-image
      - name: Check syntax
        run: |
          python -m py_compile src/services/archive_aoi_category.py tests/test_archive_aoi_category.py src/services/knn_archive_auto_memory.py src/core/archive_persistent_memory.py src/services/retire_archive_source_cli.py src/core/verified_memory_router.py src/core/experts/knn_expert.py src/services/startup_regression/knn_archive_memory_cli.py tests/test_archive_persistent_knn.py src/services/startup_regression/knn_visual_neighbors.py tests/test_knn_category_only_legacy.py
      - name: Verify learning persistence and production exact lookup
        run: python -m unittest tests.test_archive_aoi_category tests.test_archive_persistent_knn tests.test_knn_archive_auto_memory tests.test_live_session_learning tests.test_verified_memory_router tests.test_shadow_partial_persistence tests.test_knn_category_only_legacy -v
