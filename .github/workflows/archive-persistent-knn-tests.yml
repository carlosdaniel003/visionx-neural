name: Archive Persistent KNN Memory

on:
  push:
    branches: [central]
    paths:
      - "src/core/archive_persistent_memory.py"
      - "src/core/verified_memory_router.py"
      - "src/core/experts/knn_expert.py"
      - "src/services/startup_regression/knn_archive_memory_cli.py"
      - "tests/test_archive_persistent_knn.py"
      - ".github/workflows/archive-persistent-knn-tests.yml"
  workflow_dispatch:

jobs:
  persistence:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install numpy opencv-python-headless scipy scikit-image
      - name: Check syntax
        run: |
          python -m py_compile src/core/archive_persistent_memory.py src/core/verified_memory_router.py src/core/experts/knn_expert.py src/services/startup_regression/knn_archive_memory_cli.py tests/test_archive_persistent_knn.py
      - name: Verify learning persistence and production exact lookup
        run: python -m unittest tests.test_archive_persistent_knn tests.test_verified_memory_router -v
