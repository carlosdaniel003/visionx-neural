name: Startup Regression Memory Reconciliation

on:
  push:
    branches:
      - central
    paths:
      - "src/services/startup_regression/archive_reconciler.py"
      - "src/services/startup_regression/archive_reconciler_cli.py"
      - "src/services/startup_regression/legacy_memory_compat.py"
      - "src/services/startup_regression/historical_evidence_recovery.py"
      - "src/services/startup_regression/historical_evidence_recovery_cli.py"
      - "tests/test_archive_reconciler.py"
      - "tests/test_legacy_memory_compat.py"
      - "tests/test_historical_evidence_recovery.py"
      - ".github/workflows/startup-regression-reconciliation.yml"
  workflow_dispatch:

jobs:
  read_only_reconciliation:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install numpy opencv-python-headless
      - name: Check syntax
        shell: pwsh
        run: |
          python -m py_compile src/services/startup_regression/archive_reconciler.py src/services/startup_regression/archive_reconciler_cli.py src/services/startup_regression/legacy_memory_compat.py src/services/startup_regression/historical_evidence_recovery.py src/services/startup_regression/historical_evidence_recovery_cli.py tests/test_archive_reconciler.py tests/test_legacy_memory_compat.py tests/test_historical_evidence_recovery.py
      - name: Verify reconciliation contracts and PNG inventory
        shell: pwsh
        run: |
          python -m unittest tests.test_archive_reconciler tests.test_legacy_memory_compat tests.test_historical_evidence_recovery tests.test_startup_regression_inventory -v
