name: CNN FALTANDO Live Incremental Learning

on:
  push:
    branches: [central]
    paths:
      - "src/services/neural_online_learning.py"
      - "src/services/anomaly_learning.py"
      - "src/services/decision_persistence.py"
      - "src/scripts/train_faltando_cnn_v2_online.py"
      - "src/core/neural/faltando_live.py"
      - "tests/test_faltando_live_incremental_learning.py"
      - ".github/workflows/faltando-live-incremental-tests.yml"
  workflow_dispatch:

jobs:
  neural-online:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy opencv-python-headless scipy scikit-image
      - name: Compile new modules
        run: python -m py_compile src/services/neural_online_learning.py src/services/anomaly_learning.py src/services/decision_persistence.py src/scripts/train_faltando_cnn_v2_online.py src/core/neural/faltando_live.py tests/test_faltando_live_incremental_learning.py
      - name: Test online spool training, candidate gates and live reload
        run: python -m unittest tests.test_faltando_live_incremental_learning -v
