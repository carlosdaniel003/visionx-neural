name: DESLOCADO v3 Full Body ROI Review

on:
  push:
    branches: [central]
    paths:
      - "src/services/deslocado_body_masks_v3.py"
      - "src/scripts/prepare_deslocado_body_masks_v3.py"
      - "tests/test_deslocado_body_masks_v3.py"
      - ".github/workflows/deslocado-body-mask-v3-tests.yml"
  workflow_dispatch:

jobs:
  full-body-mask-review:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install NumPy/OpenCV and Torch
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy opencv-python-headless
      - name: Compile and validate mask review
        run: |
          python -m py_compile src/services/deslocado_body_masks_v3.py src/scripts/prepare_deslocado_body_masks_v3.py tests/test_deslocado_body_masks_v3.py
          python -m unittest tests.test_deslocado_body_masks_v3 -v
