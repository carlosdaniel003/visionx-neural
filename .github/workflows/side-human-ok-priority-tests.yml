name: ODIN SIDE Human OK Priority

on:
  pull_request:
    branches: [central]
    paths:
      - "src/core/side_memory_first.py"
      - "src/ui/production_confidence_gate.py"
      - "tests/test_side_memory_first.py"
      - ".github/workflows/side-human-ok-priority-tests.yml"
  push:
    branches: [central]
    paths:
      - "src/core/side_memory_first.py"
      - "src/ui/production_confidence_gate.py"
      - "tests/test_side_memory_first.py"
      - ".github/workflows/side-human-ok-priority-tests.yml"
  workflow_dispatch:

jobs:
  side-human-ok:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless scipy scikit-image PyQt6 pillow mss pytesseract
      - name: Check syntax
        run: python -m py_compile src/core/side_memory_first.py src/ui/production_confidence_gate.py tests/test_side_memory_first.py
      - name: Regression tests for human OK and production policy
        run: python -m unittest tests.test_side_memory_first tests.test_human_multilight_priority tests.test_production_confidence_gate.ProductionPolicyTests -v
