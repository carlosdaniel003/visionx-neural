name: ODIN Production Session Judged Metrics

on:
  push:
    branches: [central]
    paths:
      - "src/services/production_daily_session_store.py"
      - "src/ui/production_session_feedback.py"
      - "src/ui/production_autonomy_controller.py"
      - "tests/test_production_daily_session_store.py"
      - "tests/test_production_session_feedback.py"
      - "tests/test_production_autonomy_controller.py"
      - ".github/workflows/production-session-judged-metrics-tests.yml"
  pull_request:
    branches: [central]
    paths:
      - "src/services/production_daily_session_store.py"
      - "src/ui/production_session_feedback.py"
      - "src/ui/production_autonomy_controller.py"
      - "tests/test_production_daily_session_store.py"
      - "tests/test_production_session_feedback.py"
      - "tests/test_production_autonomy_controller.py"
      - ".github/workflows/production-session-judged-metrics-tests.yml"
  workflow_dispatch:

jobs:
  judged-metrics:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: "offscreen"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Python requirements
        run: |
          python -m pip install "numpy>=1.26,<3" "opencv-python-headless>=4.8,<5" PyQt6
      - name: Compile session code and regression tests
        run: |
          python -m py_compile src/services/production_daily_session_store.py src/ui/production_session_feedback.py src/ui/production_autonomy_controller.py tests/test_production_daily_session_store.py tests/test_production_session_feedback.py tests/test_production_autonomy_controller.py
      - name: Verify judged-only daily session counters and controller
        run: |
          python -m unittest tests.test_production_daily_session_store tests.test_production_session_feedback tests.test_production_autonomy_controller -v
