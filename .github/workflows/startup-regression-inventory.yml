name: Startup Regression Inventory

on:
  push:
    branches:
      - central
    paths:
      - "src/services/startup_regression/**"
      - "tests/test_startup_regression_inventory.py"
      - ".github/workflows/startup-regression-inventory.yml"
  workflow_dispatch:

jobs:
  inventory:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight dependencies
        shell: pwsh
        run: |
          python -m pip install numpy opencv-python-headless
      - name: Compile archive inventory
        shell: pwsh
        run: |
          python -m py_compile src/services/startup_regression/archive_inventory.py src/services/startup_regression/archive_inventory_report.py src/services/startup_regression/__main__.py
      - name: Run stage 1 inventory tests
        shell: pwsh
        run: |
          python -m unittest tests.test_startup_regression_inventory -v
