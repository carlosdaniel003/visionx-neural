name: DESLOCADO OK False NG Visual Diagnostics

on:
  push:
    branches: [central]
    paths:
      - "src/scripts/diagnose_deslocado_ok_failures.py"
      - "tests/test_diagnose_deslocado_ok_failures.py"
      - ".github/workflows/diagnose-deslocado-ok-tests.yml"
  workflow_dispatch:

jobs:
  false-ng-panels:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy opencv-python-headless
      - name: Syntax and regression tests
        run: |
          python -m py_compile src/scripts/diagnose_deslocado_ok_failures.py tests/test_diagnose_deslocado_ok_failures.py
          python -m unittest tests.test_diagnose_deslocado_ok_failures -v
