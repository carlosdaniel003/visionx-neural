name: DESLOCADO OK Geometry v1.1 Feature Registration

on:
  push:
    branches: [central]
    paths:
      - "src/services/deslocado_ok_geometry_v11.py"
      - "src/scripts/diagnose_deslocado_ok_geometry_v11.py"
      - "tests/test_deslocado_ok_geometry_v11.py"
      - ".github/workflows/deslocado-ok-geometry-v11-tests.yml"
  workflow_dispatch:

jobs:
  offline-geometry-v11:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy opencv-python-headless
      - name: Syntax and regression tests
        run: |
          python -m py_compile src/services/deslocado_ok_geometry_v11.py src/scripts/diagnose_deslocado_ok_geometry_v11.py tests/test_deslocado_ok_geometry_v11.py
          python -m unittest tests.test_deslocado_ok_geometry tests.test_deslocado_ok_geometry_v11 -v
