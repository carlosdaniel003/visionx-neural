name: ODIN Operator Confirmed CNN Quality Labels

on:
  push:
    branches: [central]
    paths:
      - "src/services/odin_operator_confirmed_labels.py"
      - "src/services/aoi_universal_quality_archive.py"
      - "docs/odin_operator_confirmed_quality_20261026.json"
      - "tests/test_odin_operator_confirmed_labels.py"
      - ".github/workflows/odin-operator-confirmations-tests.yml"
  pull_request:
    branches: [central]
    paths:
      - "src/services/odin_operator_confirmed_labels.py"
      - "src/services/aoi_universal_quality_archive.py"
      - "docs/odin_operator_confirmed_quality_20261026.json"
      - "tests/test_odin_operator_confirmed_labels.py"
      - ".github/workflows/odin-operator-confirmations-tests.yml"
  workflow_dispatch:

jobs:
  audited-labels:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal qualification dependencies
        run: python -m pip install numpy opencv-python-headless
      - name: Compile changed sources
        run: python -m py_compile src/services/odin_operator_confirmed_labels.py src/services/aoi_universal_quality_archive.py tests/test_odin_operator_confirmed_labels.py
      - name: Run operator-label integrity tests
        run: python -m unittest tests.test_odin_operator_confirmed_labels -v
