name: Prototype Memory

on:
  push:
    branches:
      - central
    paths:
      - "src/core/prototype_memory.py"
      - "src/core/dual_scale_memory.py"
      - "src/core/anomaly_signature.py"
      - "src/core/best_match_memory.py"
      - "src/core/strict_category_memory.py"
      - "src/core/experts/knn_expert.py"
      - "src/services/dataset_manager.py"
      - "src/services/anomaly_learning.py"
      - "main.py"
      - "tests/test_prototype_memory.py"
      - "tests/test_dual_scale_memory.py"
      - "tests/test_best_match_memory.py"
      - ".github/workflows/prototype-memory-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless

      - name: Compile memory modules
        run: |
          python -m py_compile `
            src/core/prototype_memory.py `
            src/core/dual_scale_memory.py `
            src/core/anomaly_signature.py `
            src/core/best_match_memory.py `
            src/core/strict_category_memory.py `
            src/core/experts/knn_expert.py `
            src/services/dataset_manager.py `
            src/services/anomaly_learning.py `
            main.py `
            tests/test_prototype_memory.py

      - name: Run prototype and memory regression tests
        run: |
          python -m unittest `
            tests.test_prototype_memory `
            tests.test_dual_scale_memory `
            tests.test_best_match_memory `
            -v
