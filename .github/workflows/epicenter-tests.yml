name: Epicenter ROI Tests

on:
  push:
    branches:
      - central
    paths:
      - "src/config/settings.py"
      - "src/core/epicenter_extractor.py"
      - "src/core/inspection.py"
      - "tests/test_epicenter_extractor.py"
      - ".github/workflows/epicenter-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless scikit-image

      - name: Compile
        run: |
          python -m py_compile \
            src/config/settings.py \
            src/core/epicenter_extractor.py \
            src/core/inspection.py

      - name: Unit tests
        run: |
          python -m unittest tests.test_epicenter_extractor -v
