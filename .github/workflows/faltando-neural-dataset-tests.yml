name: FALTANDO Neural Dataset Preparation

on:
  push:
    branches: [central]
    paths:
      - "src/services/faltando_neural_dataset.py"
      - "tests/test_faltando_neural_dataset.py"
      - "docs/FALTANDO_CNN_DATASET_PREPARATION.md"
      - ".github/workflows/faltando-neural-dataset-tests.yml"
  workflow_dispatch:

jobs:
  preparation:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal extractor dependencies
        run: python -m pip install numpy opencv-python-headless PyQt6 mss pytesseract
      - name: Check syntax
        run: python -m py_compile src/services/faltando_neural_dataset.py tests/test_faltando_neural_dataset.py
      - name: Test preparation without original AOI files
        run: python -m unittest tests.test_faltando_neural_dataset -v
