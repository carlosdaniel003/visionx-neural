name: AOI V3 Primary and MSS Archive Parity

on:
  push:
    branches: [central]
    paths:
      - "main.py"
      - "src/core/neural/aoi_quality_cnn_v3_primary.py"
      - "src/core/neural/aoi_quality_cnn_v3_production_trial.py"
      - "src/core/verified_memory_router.py"
      - "src/ui/archive_visual_presence_feedback.py"
      - "src/services/archive_rendered_source_match.py"
      - "src/ui/widgets/neural_evidence.py"
      - "src/ui/widgets/knn_spectrum.py"
      - "src/ui/widgets/neural_specialist.py"
      - "src/ui/adhesive_multilight_analysis.py"
      - "src/ui/neural_influence_model.py"
      - "src/ui/inspection_memory_feedback.py"
      - "src/ui/local_capture_safety.py"
      - "src/core/multilight_fusion.py"
      - "src/ui/neural_telemetry_model.py"
      - "src/ui/production_confidence_gate.py"
      - "src/services/capture_debug_payload.py"
      - "tests/test_aoi_v3_primary_mss.py"
      - "tests/test_archive_rendered_source_match.py"
      - ".github/workflows/aoi-v3-primary-mss-tests.yml"
  pull_request:
    branches: [central]
  workflow_dispatch:

jobs:
  v3-primary-mss:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native Qt prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Install dependencies
        run: python -m pip install "numpy>=1.26,<3" "opencv-python-headless>=4.8,<5" PyQt6 scipy scikit-image
      - name: Compile changed modules
        run: |
          python -m py_compile main.py src/core/neural/aoi_quality_cnn_v3_primary.py src/core/neural/aoi_quality_cnn_v3_production_trial.py src/ui/archive_visual_presence_feedback.py src/services/archive_rendered_source_match.py src/ui/local_capture_safety.py src/core/verified_memory_router.py src/core/multilight_fusion.py src/ui/neural_telemetry_model.py src/ui/production_confidence_gate.py src/services/capture_debug_payload.py tests/test_aoi_v3_primary_mss.py
      - name: Test V3 and MSS contracts without physical XP
        run: |
          python -m unittest tests.test_aoi_v3_primary_mss tests.test_archive_rendered_source_match tests.test_aoi_quality_v3_production_policy tests.test_archive_visual_presence tests.test_neural_telemetry_panels -v
