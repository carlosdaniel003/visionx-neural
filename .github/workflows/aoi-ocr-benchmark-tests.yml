name: AOI OCR Offline Benchmark

on:
  pull_request:
    branches: [central]
    paths:
      - "src/services/aoi_ocr_benchmark.py"
      - "src/services/aoi_ocr_thread_trial.py"
      - "tests/test_aoi_ocr_benchmark.py"
      - "tests/test_aoi_ocr_thread_trial.py"
      - "docs/AOI_OCR_BENCHMARK.md"
      - "docs/AOI_OCR_ENGINE_EVALUATION.md"
      - ".github/workflows/aoi-ocr-benchmark-tests.yml"
  push:
    branches: [central]
    paths:
      - "src/services/aoi_ocr_benchmark.py"
      - "src/services/aoi_ocr_thread_trial.py"
      - "tests/test_aoi_ocr_benchmark.py"
      - "tests/test_aoi_ocr_thread_trial.py"
      - ".github/workflows/aoi-ocr-benchmark-tests.yml"
  workflow_dispatch:

jobs:
  benchmark-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional OCR benchmark dependencies
        shell: pwsh
        run: python -m pip install numpy opencv-python-headless PyQt6 mss pytesseract
      - name: Compile
        shell: pwsh
        run: python -m py_compile src/services/aoi_ocr_benchmark.py src/services/aoi_ocr_thread_trial.py tests/test_aoi_ocr_benchmark.py tests/test_aoi_ocr_thread_trial.py
      - name: Offline safety regression
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: python -m unittest tests.test_aoi_ocr_benchmark tests.test_aoi_ocr_thread_trial tests.test_aoi_ocr_fields -v
