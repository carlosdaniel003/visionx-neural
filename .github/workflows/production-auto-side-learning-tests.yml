name: Production Auto SIDE Operational Memory

on:
  pull_request:
    branches: [central]
    paths:
      - "src/core/production_auto_side_recall.py"
      - "src/services/anomaly_learning.py"
      - "src/services/decision_persistence.py"
      - "src/ui/adhesive_multilight_inspection.py"
      - "src/ui/production_confidence_gate.py"
      - "tests/test_production_auto_side_recall.py"
      - ".github/workflows/production-auto-side-learning-tests.yml"
  push:
    branches: [central]
    paths:
      - "src/core/production_auto_side_recall.py"
      - "src/services/anomaly_learning.py"
      - "src/services/decision_persistence.py"
      - "src/ui/adhesive_multilight_inspection.py"
      - "src/ui/production_confidence_gate.py"
      - "tests/test_production_auto_side_recall.py"
      - ".github/workflows/production-auto-side-learning-tests.yml"
  workflow_dispatch:

jobs:
  auto-side:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: "offscreen"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - name: Python dependencies
        run: |
          python -m pip install numpy opencv-python-headless scipy scikit-image PyQt6
      - name: Compile affected modules
        run: |
          python -m py_compile src/core/production_auto_side_recall.py \
            src/services/anomaly_learning.py \
            src/services/decision_persistence.py \
            src/ui/production_confidence_gate.py \
            src/ui/adhesive_multilight_inspection.py \
            tests/test_production_auto_side_recall.py
      - name: Auto-side, human safety and production policy regressions
        run: |
          python -m unittest \
            tests.test_production_auto_side_recall \
            tests.test_anomaly_learning_policy \
            tests.test_production_continuous_auto.ContinuousAutoPolicyTests -v
