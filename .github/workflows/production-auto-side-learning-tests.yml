name: Production Auto SIDE Operational Memory

on:
  pull_request:
    branches: [central]
    paths:
      - "src/core/production_auto_side_recall.py"
      - "src/services/anomaly_learning.py"
      - "src/services/decision_persistence.py"
      - "src/services/dataset_manager.py"
      - "src/services/neural_online_learning.py"
      - "src/services/network_receiver.py"
      - "src/ui/network_image_cycle_gate.py"
      - "src/ui/production_autonomy_controller.py"
      - "tests/test_reinspection_learning.py"
      - "tests/test_network_aoi_intake_filter.py"
      - "tests/test_production_autonomy_controller.py"
      - "tests/test_anomaly_learning_policy.py"
      - "src/ui/adhesive_multilight_inspection.py"
      - "src/ui/production_confidence_gate.py"
      - "src/ui/control_panel.py"
      - "src/services/ng_image_archive.py"
      - "tests/test_ng_image_archive.py"
      - "tests/test_production_auto_side_recall.py"
      - "tests/test_memory_visual_feedback_v2.py"
      - "src/ui/neural_telemetry_model.py"
      - "src/ui/inspection_memory_feedback.py"
      - "src/ui/decision_panel.py"
      - ".github/workflows/production-auto-side-learning-tests.yml"
  push:
    branches: [central]
    paths:
      - "src/core/production_auto_side_recall.py"
      - "src/services/anomaly_learning.py"
      - "src/services/decision_persistence.py"
      - "src/services/dataset_manager.py"
      - "src/services/neural_online_learning.py"
      - "src/services/network_receiver.py"
      - "src/ui/network_image_cycle_gate.py"
      - "src/ui/production_autonomy_controller.py"
      - "tests/test_reinspection_learning.py"
      - "tests/test_network_aoi_intake_filter.py"
      - "tests/test_production_autonomy_controller.py"
      - "tests/test_anomaly_learning_policy.py"
      - "src/ui/adhesive_multilight_inspection.py"
      - "src/ui/production_confidence_gate.py"
      - "tests/test_production_auto_side_recall.py"
      - "tests/test_memory_visual_feedback_v2.py"
      - "src/ui/neural_telemetry_model.py"
      - "src/ui/inspection_memory_feedback.py"
      - "src/ui/decision_panel.py"
      - ".github/workflows/production-auto-side-learning-tests.yml"
  workflow_dispatch:

jobs:
  auto-side:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: "offscreen"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - name: Python dependencies
        run: |
          python -m pip install numpy opencv-python-headless scipy scikit-image PyQt6 mss pytesseract
      - name: Compile affected modules
        run: |
          python -m py_compile src/core/production_auto_side_recall.py \
            src/services/anomaly_learning.py \
            src/services/decision_persistence.py \
            src/services/dataset_manager.py \
            src/services/neural_online_learning.py \
            src/services/network_receiver.py \
            src/ui/network_image_cycle_gate.py \
            src/ui/production_autonomy_controller.py \
            tests/test_reinspection_learning.py \
            tests/test_network_aoi_intake_filter.py \
            tests/test_anomaly_learning_policy.py \
            tests/test_production_autonomy_controller.py \
            src/ui/production_confidence_gate.py \
            src/ui/adhesive_multilight_inspection.py \
            tests/test_production_auto_side_recall.py \
            src/ui/neural_telemetry_model.py \
            src/ui/inspection_memory_feedback.py \
            src/ui/decision_panel.py \
            tests/test_memory_visual_feedback_v2.py
      - name: Auto-side, human safety and production policy regressions
        run: |
          python -m unittest \
            tests.test_production_auto_side_recall \
            tests.test_memory_visual_feedback_v2 \
            tests.test_anomaly_learning_policy \
            tests.test_reinspection_learning \
            tests.test_network_aoi_intake_filter \
            tests.test_production_autonomy_controller \
            tests.test_ng_image_archive \
            tests.test_production_continuous_auto.ContinuousAutoPolicyTests -v
