name: Verified Memory First Routing

on:
  push:
    branches: [central]
    paths:
      - "src/core/verified_memory_router.py"
      - "src/ui/memory_status_ui.py"
      - "src/ui/production_confidence_gate.py"
      - "src/core/multilight_fusion.py"
      - "src/ui/control_panel.py"
      - "main.py"
      - "tests/test_verified_memory_router.py"
      - ".github/workflows/verified-memory-routing-tests.yml"
  workflow_dispatch:

jobs:
  memory-routing:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install numpy opencv-python-headless scipy scikit-image
      - name: Check Python source compilation
        run: |
          python -m py_compile src/core/verified_memory_router.py src/ui/memory_status_ui.py src/ui/production_confidence_gate.py src/core/multilight_fusion.py src/ui/control_panel.py main.py tests/test_verified_memory_router.py
      - name: Test known-new routing and production safety
        run: python -m unittest tests.test_verified_memory_router tests.test_production_confidence_gate.ProductionPolicyTests -v
