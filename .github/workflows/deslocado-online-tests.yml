name: DESLOCADO CNN Online Candidate Tests

on:
  push:
    branches: [central]
    paths:
      - "src/scripts/train_deslocado_cnn.py"
      - "src/scripts/train_deslocado_cnn_online.py"
      - "src/services/neural_online_learning.py"
      - "src/core/verified_memory_router.py"
      - "src/ui/memory_status_ui.py"
      - "tests/test_deslocado_online.py"
      - ".github/workflows/deslocado-online-tests.yml"
  workflow_dispatch:

jobs:
  deslocado-online:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy opencv-python-headless scipy scikit-image
      - name: Syntax and unit tests
        run: |
          python -m py_compile src/scripts/train_deslocado_cnn_online.py src/scripts/train_deslocado_cnn.py tests/test_deslocado_online.py
          python -m unittest tests.test_deslocado_cnn tests.test_deslocado_online -v
