name: ODIN Unified Verdict and Memory Overlay

on:
  push:
    branches: [central]
    paths:
      - "main.py"
      - "src/ui/decision_verdict_feedback.py"
      - "src/ui/decision_key_feedback.py"
      - "tests/test_combined_verdict_memory_overlay.py"
      - ".github/workflows/combined-verdict-memory-tests.yml"
  pull_request:
    branches: [central]
  workflow_dispatch:

jobs:
  combined-tooltip:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: "offscreen"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Python dependencies
        run: |
          python -m pip install "numpy>=1.26,<3" "opencv-python-headless>=4.8,<5" scipy scikit-image PyQt6
      - name: Syntax verification
        run: |
          python -m py_compile main.py src/ui/decision_verdict_feedback.py src/ui/decision_key_feedback.py tests/test_combined_verdict_memory_overlay.py
      - name: Verify unified overlay and no regressions
        run: |
          python -m unittest tests.test_combined_verdict_memory_overlay tests.test_decision_verdict_feedback tests.test_lighting_status_feedback tests.test_decision_key_feedback tests.test_memory_visual_feedback_v2 tests.test_neural_telemetry_panels -v
