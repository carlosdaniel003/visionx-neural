name: FALTANDO CNN V2 Live Routing

on:
  push:
    branches: [central]
    paths:
      - "src/core/neural/faltando_live.py"
      - "src/ui/production_confidence_gate.py"
      - "src/ui/control_panel.py"
      - "main.py"
      - "tests/test_faltando_cnn_v2_live.py"
      - ".github/workflows/faltando-cnn-v2-live-tests.yml"
  workflow_dispatch:

jobs:
  live-guardrails:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ML and compatibility dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy opencv-python-headless scipy scikit-image
      - name: Compile code
        run: python -m py_compile src/core/neural/faltando_live.py src/ui/production_confidence_gate.py src/ui/control_panel.py main.py tests/test_faltando_cnn_v2_live.py
      - name: Test CNN v2 FALTANDO bypass, missing weights and Production gate
        run: python -m unittest tests.test_faltando_cnn_v2_live -v
      - name: Check existing production decision policy regression
        run: python -m unittest tests.test_production_confidence_gate.ProductionPolicyTests -v
