name: Production Confidence Gate Tests

on:
  push:
    branches:
      - central
    paths:
      - "main.py"
      - "src/ui/production_confidence_gate.py"
      - "src/core/side_early_decision.py"
      - "tests/test_side_early_decision.py"
      - "src/core/neural/faltando_category_scope.py"
      - "src/services/anomaly_learning.py"
      - "src/ui/operational_controls.py"
      - "tests/test_production_confidence_gate.py"
      - ".github/workflows/production-confidence-tests.yml"
  pull_request:
    branches:
      - central
    paths:
      - "src/core/side_early_decision.py"
      - "src/ui/production_confidence_gate.py"
      - "tests/test_side_early_decision.py"
      - "tests/test_production_confidence_gate.py"
      - ".github/workflows/production-confidence-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install policy dependencies
        run: |
          python -m pip install "numpy>=1.26,<3" "opencv-python-headless>=4.8,<5"

      - name: Compile policy
        run: |
          python -m py_compile src/core/side_early_decision.py src/ui/production_confidence_gate.py

      - name: Unit tests
        run: |
          python -m unittest tests.test_side_early_decision tests.test_production_confidence_gate -v
