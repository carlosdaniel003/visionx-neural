name: KNN Archive Visual Replay Tests

on:
  push:
    branches: [central]
    paths:
      - "src/services/startup_regression/knn_archive_visual_replay.py"
      - "src/core/knn_c_live.py"
      - "src/core/knn_c_multilight_gate.py"
      - "src/core/multilight_fusion.py"
      - "tests/test_knn_c_multilight_gate.py"
      - "tests/test_knn_c_live.py"
      - "main.py"
      - "src/services/startup_regression/knn_archive_focus_signature.py"
      - "src/services/startup_regression/knn_archive_geometry_experiment.py"
      - "src/services/startup_regression/knn_archive_concordance_experiment.py"
      - "src/services/startup_regression/knn_archive_augmented_replay.py"
      - "src/services/startup_regression/knn_archive_augmented_replay_cli.py"
      - "tests/test_knn_archive_augmented_replay.py"
      - "tests/test_knn_archive_concordance_experiment.py"
      - "tests/test_knn_archive_geometry_experiment.py"
      - "tests/test_knn_archive_focus_signature.py"
      - "src/core/knn_similarity_shadow_candidate.py"
      - "tests/test_knn_similarity_shadow_candidate.py"
      - "src/services/startup_regression/knn_archive_visual_replay_cli.py"
      - "tests/test_knn_archive_visual_replay.py"
      - "src/services/startup_regression/knn_visual_panel_worker.py"
      - ".github/workflows/knn-archive-visual-replay-tests.yml"
  pull_request:
    branches: [central]
    paths:
      - "src/services/startup_regression/knn_archive_visual_replay.py"
      - "src/core/knn_c_live.py"
      - "src/core/knn_c_multilight_gate.py"
      - "src/core/multilight_fusion.py"
      - "tests/test_knn_c_multilight_gate.py"
      - "tests/test_knn_c_live.py"
      - "main.py"
      - "src/services/startup_regression/knn_archive_focus_signature.py"
      - "src/services/startup_regression/knn_archive_geometry_experiment.py"
      - "src/services/startup_regression/knn_archive_concordance_experiment.py"
      - "src/services/startup_regression/knn_archive_augmented_replay.py"
      - "src/services/startup_regression/knn_archive_augmented_replay_cli.py"
      - "tests/test_knn_archive_augmented_replay.py"
      - "tests/test_knn_archive_concordance_experiment.py"
      - "tests/test_knn_archive_geometry_experiment.py"
      - "tests/test_knn_archive_focus_signature.py"
      - "src/core/knn_similarity_shadow_candidate.py"
      - "tests/test_knn_similarity_shadow_candidate.py"
      - "src/services/startup_regression/knn_archive_visual_replay_cli.py"
      - "src/services/startup_regression/knn_visual_panel_worker.py"
      - "src/services/archive_aoi_category.py"
      - "tests/test_knn_archive_visual_replay.py"
      - ".github/workflows/knn-archive-visual-replay-tests.yml"
  workflow_dispatch:

jobs:
  knn-archive-visual:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install numpy opencv-python-headless scipy scikit-image
      - name: Compile
        run: |
          python -m py_compile src/core/knn_c_multilight_gate.py tests/test_knn_c_multilight_gate.py src/core/knn_c_live.py tests/test_knn_c_live.py src/services/startup_regression/knn_archive_augmented_replay.py src/services/startup_regression/knn_archive_augmented_replay_cli.py tests/test_knn_archive_augmented_replay.py src/services/startup_regression/knn_archive_concordance_experiment.py tests/test_knn_archive_concordance_experiment.py src/services/startup_regression/knn_archive_geometry_experiment.py tests/test_knn_archive_geometry_experiment.py src/services/startup_regression/knn_archive_focus_signature.py tests/test_knn_archive_focus_signature.py src/core/knn_similarity_shadow_candidate.py tests/test_knn_similarity_shadow_candidate.py src/services/startup_regression/knn_visual_panel_worker.py src/services/startup_regression/knn_archive_visual_replay.py src/services/startup_regression/knn_archive_visual_replay_cli.py tests/test_knn_archive_visual_replay.py
      - name: Test archive-only KNN protocol
        run: python -m unittest tests.test_knn_c_multilight_gate tests.test_knn_c_live tests.test_knn_archive_augmented_replay tests.test_knn_archive_concordance_experiment tests.test_knn_archive_geometry_experiment tests.test_knn_archive_focus_signature tests.test_knn_archive_visual_replay tests.test_knn_similarity_shadow_candidate -v
