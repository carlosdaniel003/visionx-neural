name: General Multilight Tests

on:
  push:
    branches:
      - central
    paths:
      - "src/core/multilight_fusion.py"
      - "src/core/adhesive_multilight_fusion.py"
      - "src/core/adhesive_multilight_analysis.py"
      - "src/ui/adhesive_multilight_automation.py"
      - "src/ui/adhesive_multilight_inspection.py"
      - "src/ui/adhesive_multilight_analysis.py"
      - "src/ui/network_xp_debug.py"
      - "src/ui/control_panel.py"
      - "src/ui/control_panel_ui.py"
      - "src/services/image_archive_candidates.py"
      - "src/services/ng_image_archive.py"
      - "src/services/ok_image_archive.py"
      - "tests/test_adhesive_multilight_automation.py"
      - "tests/test_adhesive_multilight_expert_analysis.py"
      - "tests/test_adhesive_multilight_fusion.py"
      - "tests/test_adhesive_multilight_inspection.py"
      - "tests/test_multilight_generalization.py"
      - ".github/workflows/multilight-generalization-tests.yml"
  workflow_dispatch:

jobs:
  multilight:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless PyQt6 scikit-image scipy mss pytesseract

      - name: Compile multilight modules
        shell: pwsh
        run: |
          python -m py_compile src/core/multilight_fusion.py src/core/adhesive_multilight_fusion.py src/core/adhesive_multilight_analysis.py src/ui/adhesive_multilight_automation.py src/ui/adhesive_multilight_inspection.py src/ui/adhesive_multilight_analysis.py src/ui/network_xp_debug.py src/services/image_archive_candidates.py

      - name: Run multilight regressions
        shell: pwsh
        run: |
          python -m unittest tests.test_adhesive_multilight_automation tests.test_adhesive_multilight_expert_analysis tests.test_adhesive_multilight_fusion tests.test_adhesive_multilight_inspection tests.test_multilight_generalization -v
