name: Dual Scale Memory

on:
  push:
    branches:
      - central
    paths:
      - "src/core/dual_scale_memory.py"
      - "src/core/anomaly_signature.py"
      - "src/core/anomaly_memory_integration.py"
      - "src/core/best_match_memory.py"
      - "src/core/strict_category_memory.py"
      - "src/services/dataset_manager.py"
      - "main.py"
      - "tests/test_dual_scale_memory.py"
      - "tests/test_best_match_memory.py"
      - "tests/test_aoi_categories.py"
      - ".github/workflows/dual-scale-memory-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless scipy scikit-image PyQt6

      - name: Compile memory modules
        run: |
          python -m py_compile `
            src/core/dual_scale_memory.py `
            src/core/anomaly_signature.py `
            src/core/anomaly_memory_integration.py `
            src/core/best_match_memory.py `
            src/services/dataset_manager.py `
            main.py `
            tests/test_dual_scale_memory.py

      - name: Run memory regression tests
        run: |
          python -m unittest `
            tests.test_dual_scale_memory `
            tests.test_best_match_memory `
            tests.test_aoi_categories `
            -v
