name: DESLOCADO OK-Only Geometry Diagnostics

on:
  push:
    branches: [central]
    paths:
      - "src/services/deslocado_ok_geometry.py"
      - "src/scripts/diagnose_deslocado_ok_geometry.py"
      - "tests/test_deslocado_ok_geometry.py"
      - ".github/workflows/deslocado-ok-geometry-tests.yml"
  workflow_dispatch:

jobs:
  offline-geometry-diagnostics:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies (CPU only)
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy opencv-python-headless
      - name: Syntax and unit regression tests
        run: |
          python -m py_compile src/services/deslocado_ok_geometry.py src/scripts/diagnose_deslocado_ok_geometry.py tests/test_deslocado_ok_geometry.py
          python -m unittest tests.test_deslocado_ok_geometry -v
