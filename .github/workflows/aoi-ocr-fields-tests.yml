name: AOI OCR Fields

on:
  push:
    branches:
      - central
    paths:
      - "src/services/aoi_ocr_fields.py"
      - "tests/test_aoi_ocr_fields.py"
      - ".github/workflows/aoi-ocr-fields-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: python -m pip install numpy opencv-python-headless
      - name: Compile
        run: python -m py_compile src/services/aoi_ocr_fields.py tests/test_aoi_ocr_fields.py
      - name: Regression tests
        run: python -m unittest tests.test_aoi_ocr_fields -v
