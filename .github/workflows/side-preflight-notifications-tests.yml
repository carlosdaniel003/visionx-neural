name: XP SIDE Preflight and Key Feedback

on:
  push:
    branches: [central]
    paths:
      - "agente_industrial_xp.py"
      - "src/services/network_receiver.py"
      - "src/ui/control_panel.py"
      - "src/ui/lighting_status_feedback.py"
      - "src/ui/decision_key_feedback.py"
      - "src/ui/network_aoi_intake_filter.py"
      - "src/ui/network_xp_debug.py"
      - "tests/test_side_preflight.py"
      - "tests/test_lighting_status_feedback.py"
      - "tests/test_decision_key_feedback.py"
      - ".github/workflows/side-preflight-notifications-tests.yml"
  pull_request:
    branches: [central]
    paths:
      - "agente_industrial_xp.py"
      - "src/services/network_receiver.py"
      - "src/ui/control_panel.py"
      - "src/ui/lighting_status_feedback.py"
      - "src/ui/decision_key_feedback.py"
      - "src/ui/network_aoi_intake_filter.py"
      - "src/ui/network_xp_debug.py"
      - "tests/test_side_preflight.py"
      - "tests/test_lighting_status_feedback.py"
      - "tests/test_decision_key_feedback.py"
      - ".github/workflows/side-preflight-notifications-tests.yml"
  workflow_dispatch:

jobs:
  side-and-keys:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6 mss numpy opencv-python-headless pillow pytesseract scipy scikit-image
      - name: Compile edited sources and tests
        run: |
          python -m py_compile agente_industrial_xp.py src/services/network_receiver.py src/ui/control_panel.py src/ui/lighting_status_feedback.py src/ui/decision_key_feedback.py src/ui/network_aoi_intake_filter.py src/ui/network_xp_debug.py tests/test_side_preflight.py tests/test_lighting_status_feedback.py tests/test_decision_key_feedback.py
      - name: Preflight SIDE gate and failures
        run: python -m unittest tests.test_side_preflight -v
      - name: Operational lighting and decision overlays
        run: python -m unittest tests.test_decision_key_feedback tests.test_lighting_status_feedback -v
