name: Last Human Verdict Memory Regression

on:
  pull_request:
    branches: [central]
    paths:
      - "src/core/archive_persistent_memory.py"
      - "src/core/verified_memory_router.py"
      - "src/services/live_session_learning.py"
      - "src/ui/production_confidence_gate.py"
      - "tests/test_live_session_learning.py"
      - "tests/test_production_continuous_auto.py"
      - ".github/workflows/last-human-verdict-tests.yml"
  push:
    branches: [central]
    paths:
      - "src/core/archive_persistent_memory.py"
      - "src/core/verified_memory_router.py"
      - "src/services/live_session_learning.py"
      - "src/ui/production_confidence_gate.py"
      - "tests/test_live_session_learning.py"
      - "tests/test_production_continuous_auto.py"
      - ".github/workflows/last-human-verdict-tests.yml"
  workflow_dispatch:

jobs:
  correction:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install numpy opencv-python-headless scipy scikit-image PyQt6
      - name: Compile
        run: |
          python -m py_compile src/core/archive_persistent_memory.py src/core/verified_memory_router.py src/services/live_session_learning.py src/ui/production_confidence_gate.py tests/test_live_session_learning.py tests/test_production_continuous_auto.py
      - name: Test priority, persistence, router and production policy
        run: |
          python -m unittest tests.test_live_session_learning tests.test_verified_memory_router tests.test_production_continuous_auto -v
