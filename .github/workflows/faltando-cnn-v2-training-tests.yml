name: CNN FALTANDO V2 Experimental Training Tests

on:
  push:
    branches: [central]
    paths:
      - "src/core/neural/faltando_cnn_v2.py"
      - "src/scripts/train_faltando_cnn_v2.py"
      - "src/core/neural/faltando_preprocessing.py"
      - "src/core/neural/faltando_checkpoint_contract.py"
      - "src/scripts/train_faltando_cnn_v2_online.py"
      - "src/scripts/train_faltando_cnn_v2_verified_archive.py"
      - "src/services/faltando_neural_qualification.py"
      - "tests/test_faltando_verified_archive_finetuning.py"
      - "tests/test_faltando_cnn_v2_training.py"
      - ".github/workflows/faltando-cnn-v2-training-tests.yml"
  pull_request:
    branches: [central]
    paths:
      - "src/scripts/train_faltando_cnn_v2.py"
      - "src/scripts/train_faltando_cnn_v2_online.py"
      - "src/scripts/train_faltando_cnn_v2_verified_archive.py"
      - "src/services/faltando_neural_qualification.py"
      - "tests/test_faltando_verified_archive_finetuning.py"
      - "src/core/neural/faltando_checkpoint_contract.py"
      - "src/core/neural/faltando_preprocessing.py"
      - "tests/test_faltando_cnn_v2_training.py"
      - ".github/workflows/faltando-cnn-v2-training-tests.yml"
  workflow_dispatch:

jobs:
  cnn-v2-smoke:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ML dependencies (CPU)
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy opencv-python-headless
      - name: Compile v2
        run: python -m py_compile src/core/neural/faltando_checkpoint_contract.py src/core/neural/faltando_preprocessing.py src/core/neural/faltando_cnn_v2.py src/scripts/train_faltando_cnn_v2_online.py src/scripts/train_faltando_cnn_v2_verified_archive.py src/scripts/train_faltando_cnn_v2.py tests/test_faltando_verified_archive_finetuning.py tests/test_faltando_cnn_v2_training.py
      - name: Test multiscale training and integrity
        run: python -m unittest tests.test_faltando_cnn_v2_training tests.test_faltando_verified_archive_finetuning -v
      - name: Verify v1 regression tests
        run: python -m unittest tests.test_faltando_cnn_training -v
